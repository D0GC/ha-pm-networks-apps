configuration:
  bericht_tag:
    name: Berichtstag
    description: Wochentag, an dem der Wochenbericht erstellt wird.
  bericht_uhrzeit:
    name: Berichtsuhrzeit
    description: Uhrzeit im Format HH:MM (Zeitzone von Home Assistant, Standard 18:00).
  bericht_notify:
    name: Push-Dienste
    description: >-
      notify-Dienste für den Wochenbericht, z. B. notify.mobile_app_telefon.
      Leer lassen, wenn kein Push gewünscht ist.
  raeume_override:
    name: Räume anpassen
    description: >-
      Optional. Je Eintrag "raum" (Kürzel wie wohnzimmer) und beliebig name, climate, schedule,
      feuchte, schimmel, luftqualitaet, lueften, fenster, co2 oder ausblenden: true.
  praefix_klima:
    name: Präfix Thermostate
    description: Präfix für die automatische Raumerkennung (Standard climate.pm_).
  praefix_heizplan:
    name: Präfix Heizpläne
    description: Präfix der schedule-Helfer (Standard schedule.heizplan_).
  empfehlung:
    name: Empfehlungssensor
    description: Standard sensor.pm_klima_empfehlung.
  aussentemperatur:
    name: Außentemperatur
    description: Standard sensor.aussentemperatur.
  aussenfeuchte:
    name: Außenluftfeuchte
    description: Standard sensor.aussenluftfeuchte.
  heizperiode_entitaet:
    name: Freigabe Heizperiode
    description: >-
      Schalter, den die App für Heizperiode (an) und Sommer (aus) setzt. Er muss in der Integration PM Klima als Freigabe eingetragen sein. Standard input_boolean.pm_heizperiode.
  coach_ki_entitaet:
    name: KI-Dienst für den Klima-Coach
    description: >-
      ai_task-Entität für die KI-Analyse auf Anforderung. Standard ai_task.claude_ai_task.
  coach_anwesenheit:
    name: Anwesenheit im Lagebericht
    description: >-
      Personen und Anwesenheit in den Lagebericht für die KI aufnehmen.
  wetter_entitaet:
    name: Wettervorhersage
    description: >-
      weather-Entität für die Vorhersage im Klima-Coach. Standard weather.dwd_zuhause.
  log_level:
    name: Protokollstufe
    description: debug, info, warning oder error.

configuration:
  betriebsart:
    name: Operating mode
    description: >-
      pm_networks if the PM Klima integration is installed (default). generisch for any thermostats
      (climate entities) without PM Klima; rooms are then taken from the Home Assistant areas.
  plan_anwenden:
    name: Apply heating schedule
    description: >-
      Operating mode generisch only. Klima Studio sets the thermostats according to the schedules (default on).
  sommer_aktion:
    name: Summer behaviour
    description: >-
      Operating mode generisch only. plan_pausieren_und_aus pauses the schedules and turns rooms in plan
      mode off (default), plan_pausieren only pauses the schedules.
  absenktemperatur:
    name: Setback temperature
    description: >-
      Operating mode generisch only. Target temperature outside the schedule blocks in °C (default 17).
  bericht_tag:
    name: Report day
    description: Weekday on which the weekly report is created (German day names).
  bericht_uhrzeit:
    name: Report time
    description: Time as HH:MM in the Home Assistant time zone (default 18:00).
  bericht_notify:
    name: Push services
    description: notify services for the weekly report, e.g. notify.mobile_app_phone. Leave empty for no push.
  raeume_override:
    name: Room overrides
    description: >-
      Optional. Each entry needs "raum" (slug such as wohnzimmer) and may set name, climate, schedule,
      feuchte, schimmel, luftqualitaet, lueften, fenster, co2, absenk (setback temperature of the room in °C,
      operating mode generisch only) or ausblenden: true.
  praefix_klima:
    name: Thermostat prefix
    description: Prefix for automatic room discovery (default climate.pm_).
  praefix_heizplan:
    name: Schedule prefix
    description: Prefix of the schedule helpers (default schedule.heizplan_).
  empfehlung:
    name: Recommendation sensor
    description: Default sensor.pm_klima_empfehlung.
  aussentemperatur:
    name: Outdoor temperature
    description: Default sensor.aussentemperatur.
  aussenfeuchte:
    name: Outdoor humidity
    description: Default sensor.aussenluftfeuchte.
  heizperiode_entitaet:
    name: Heating season switch
    description: >-
      Switch the app sets for heating season (on) and summer (off). It must be configured as release entity in the PM Klima integration. Default input_boolean.pm_heizperiode. Optional in operating mode generisch: if the entity exists, Klima Studio only mirrors the heating season to it (e.g. for your own automations).
  coach_ki_entitaet:
    name: AI service for the climate coach
    description: >-
      ai_task entity used for on-demand AI analysis. Default ai_task.claude_ai_task.
  coach_anwesenheit:
    name: Presence in the situation report
    description: >-
      Include persons and presence in the report sent to the AI.
  wetter_entitaet:
    name: Weather forecast
    description: >-
      weather entity used for the forecast in the climate coach. Default weather.dwd_zuhause.
  panel_schluessel:
    name: Key for PM Panel Studio
    description: >-
      Optional, at least 16 characters. The same value in PM Panel Studio (option klima_studio_schluessel) embeds Klima Studio in the wall panel. Leave empty to keep Klima Studio reachable via the sidebar only.
  log_level:
    name: Log level
    description: debug, info, warning or error.

name: PM Klima Studio
version: "1.2.0"
slug: pm_klima_studio
description: >-
  Heizplan-Editor, Steuerung, Klima-Auswertungen, Klima-Coach und Wochenbericht für die Integration PM Klima.
url: "https://github.com/D0GC/ha-pm-networks-apps"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:thermometer-lines
panel_title: Klima Studio
panel_admin: true
homeassistant_api: true
hassio_api: false
stage: stable
timeout: 20
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  betriebsart: pm_networks
  bericht_tag: sonntag
  bericht_uhrzeit: "18:00"
  bericht_notify: []
  raeume_override: []
  heizperiode_entitaet: input_boolean.pm_heizperiode
  coach_ki_entitaet: ai_task.claude_ai_task
  coach_anwesenheit: true
  wetter_entitaet: weather.dwd_zuhause
  log_level: info
schema:
  betriebsart: list(pm_networks|generisch)?
  plan_anwenden: bool?
  sommer_aktion: list(plan_pausieren_und_aus|plan_pausieren)?
  absenktemperatur: float(5,25)?
  bericht_tag: list(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)
  bericht_uhrzeit: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  bericht_notify:
    - str
  raeume_override:
    - raum: str
      name: str?
      climate: str?
      schedule: str?
      feuchte: str?
      schimmel: str?
      luftqualitaet: str?
      lueften: str?
      fenster: str?
      co2: str?
      absenk: float(5,25)?
      ausblenden: bool?
  praefix_klima: str?
  praefix_heizplan: str?
  empfehlung: str?
  aussentemperatur: str?
  aussenfeuchte: str?
  heizperiode_entitaet: str?
  coach_ki_entitaet: str?
  coach_anwesenheit: bool?
  wetter_entitaet: str?
  log_level: list(debug|info|warning|error)
